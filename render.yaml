services:
  - type: web
    name: livefix-app
    runtime: python
    region: oregon
    plan: free
    buildCommand: chmod +x ./build.sh && ./build.sh
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NODE_VERSION
        value: 22.14.0
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: USE_MYSQL
        value: false
      - key: FLASK_ENV
        value: production
